plugins { id 'com.android.application' }

// Release signing comes from keystore.properties (never committed) or the matching
// GROKWEAR_* environment variables in CI. Without either, release builds fall back to
// the local debug key, which is fine for installing on your own watch only.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def signingValue = { String key -> signingProps.getProperty(key) ?: System.getenv('GROKWEAR_' + key.toUpperCase()) }

android {
    namespace 'si.zya.grokwear'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '29.0.13113456'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'si.zya.grokwear'
        minSdk 30
        targetSdk 36
        versionCode 26
        versionName '0.6.0'
        // The "Hello Grok" wake word engine. Wear OS watches run 64-bit or 32-bit ARM.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' } }
    signingConfigs {
        if (signingValue('storeFile')) {
            release {
                storeFile file(signingValue('storeFile'))
                storePassword signingValue('storePassword')
                keyAlias signingValue('keyAlias')
                keyPassword signingValue('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            signingConfig signingValue('storeFile') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    // sherpa-onnx's library (HelloCheck) is large: compressed in the APK it downloads in half the size.
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    implementation 'androidx.wear:wear-input:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
