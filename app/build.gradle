plugins { id 'com.android.application' }

// Release signing comes from keystore.properties (never committed) or the matching
// GROKWEAR_* environment variables in CI. Without either, release builds fall back to
// the local debug key, which is fine for installing on your own watch only.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def signingValue = { String key -> signingProps.getProperty(key) ?: System.getenv('GROKWEAR_' + key.toUpperCase()) }
// Report a problem's optional "Send logs" (off by default) goes to this Sentry project. Without it the option is hidden.
def sentryDsn = ((project.findProperty('GROKWEAR_SENTRY_DSN') ?: System.getenv('GROKWEAR_SENTRY_DSN')) ?: '').toString().trim()
if (!(sentryDsn ==~ /[A-Za-z0-9:\/@._-]*/)) throw new GradleException('GROKWEAR_SENTRY_DSN has unexpected characters.')

android {
    namespace 'si.zya.grokwear'
    compileSdk 36
    buildToolsVersion '35.0.0'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'si.zya.grokwear'
        minSdk 30
        targetSdk 36
        versionCode 35
        versionName '0.6.3'
        buildConfigField 'String', 'SENTRY_DSN', "\"${sentryDsn}\""
        // On-device tests run on an emulator only (ANDROID_SERIAL), never a personal watch.
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (signingValue('storeFile')) {
            release {
                storeFile file(signingValue('storeFile'))
                storePassword signingValue('storePassword')
                keyAlias signingValue('keyAlias')
                keyPassword signingValue('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            signingConfig signingValue('storeFile') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    implementation 'androidx.wear:wear-input:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

// On-device tests install a test copy of Grok Wear and uninstall the app afterwards, sign-in included.
// They run only on one named emulator that doesn't have Grok Wear: ANDROID_SERIAL=emulator-NNNN.
tasks.register('checkTestDevice') {
    doLast {
        def serial = System.getenv('ANDROID_SERIAL') ?: ''
        if (!serial.startsWith('emulator-'))
            throw new GradleException('On-device tests run on one emulator only: set ANDROID_SERIAL=emulator-NNNN, an emulator without Grok Wear.')
        def adb = new File(android.sdkDirectory, 'platform-tools/adb').path
        def packages = [adb, '-s', serial, 'shell', 'pm', 'list', 'packages', 'si.zya.grokwear'].execute().text
        if (packages.readLines().any { it.trim() == 'package:si.zya.grokwear' })
            throw new GradleException("Grok Wear is installed on $serial. The test run would uninstall it, sign-in included. Uninstall it there first, or use another emulator.")
    }
}
tasks.matching { it.name.startsWith('connected') && it.name.endsWith('AndroidTest') }.configureEach { dependsOn 'checkTestDevice' }
